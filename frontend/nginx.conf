# 前端容器 nginx 配置：静态托管 + /api 反代后端（compose 服务名 backend）。
# proxy_pass 不带路径 → 原样透传 /api/*，与后端路由前缀一致。
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 首次匹配任务可能触发 BERT 下载/建缓存
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
